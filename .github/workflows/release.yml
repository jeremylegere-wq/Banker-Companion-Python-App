name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag and run checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Tag must match __version__
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('deal_or_no_deal_v4.py').read()).group(1))")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ v$VERSION"; exit 1
          fi
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -v

  release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # only this job may create the release
    steps:
      - uses: actions/checkout@v4
      - name: Build release assets
        run: |
          mkdir dist
          cp deal_or_no_deal_v4.py requirements.txt dist/
          git archive --format=zip --prefix="deal-or-no-deal-${GITHUB_REF_NAME}/" -o "dist/deal-or-no-deal-${GITHUB_REF_NAME}-source.zip" HEAD
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Extract release notes from CHANGELOG
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '$0 ~ "^## \\["v"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::No CHANGELOG section for $V"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
